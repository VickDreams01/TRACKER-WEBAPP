/* ============================== Activity Log (superadmin only) ============================== */
// Every task a logged-in staff/admin performs writes one entry here (see
// logActivity), so a superadmin can always see exactly who did what and when
// — logins/logouts, bookings, status changes, client & login management, and
// deletion requests/approvals all show up on one timeline.
function viewActivityLog(){
  let list = state.activityLog.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  if(activityFilter.actorId) list = list.filter(l=>l.actorId===activityFilter.actorId);
  if(activityFilter.q){
    const q = activityFilter.q.toLowerCase();
    list = list.filter(l=>
      (l.summary||'').toLowerCase().includes(q) ||
      (l.actorName||'').toLowerCase().includes(q) ||
      (l.actorStaffId||'').toLowerCase().includes(q) ||
      (l.targetId||'').toLowerCase().includes(q)
    );
  }
  const filterName = activityFilter.actorId ? findAdminById(activityFilter.actorId) : null;

  const staffOpts = state.admins.slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(a=>`<option value="${esc(a.id)}" ${activityFilter.actorId===a.id?'selected':''}>${esc(a.name)} (${esc(a.staffId)})</option>`).join('');

  const rows = list.slice(0,250).map(l=>{
    const clickable = l.targetType==='parcel' && l.targetId;
    return `
    <tr class="${clickable?'row-click':''}" ${clickable?`data-activity-goto="${esc(l.targetId)}"`:''}>
      <td class="hint" style="white-space:nowrap;">${fmtWhen(l.createdAt)}</td>
      <td>
        <div style="display:flex; align-items:center; gap:8px;">
          ${avatarSVG(l.actorName||'?', l.actorStaffId||'', 26)}
          <div style="min-width:0;">
            <div style="font-weight:600; font-size:12.5px;">${esc(l.actorName||'Unknown')}</div>
            <div class="hint"><span class="staffid">${esc(l.actorStaffId||'')}</span> &middot; ${esc(roleLabel(l.actorRole))}</div>
          </div>
        </div>
      </td>
      <td>${esc(l.summary || l.action)}</td>
      <td>${clickable ? tnHtml(l.targetId) : (l.targetId?esc(l.targetId):'&mdash;')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="section-head" style="margin-top:22px;">
      <div><h2>Activity Log</h2><div class="muted">Every action performed on the platform, with the exact staff or admin who did it.</div></div>
    </div>
    ${filterName ? `<div class="hint" style="margin-bottom:10px;">Showing only ${esc(filterName.name)} (${esc(filterName.staffId)}) &middot; <button type="button" class="link-btn" id="activityClearActor">Clear</button></div>` : ''}
    <div class="section-head">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <input id="activitySearch" placeholder="Search action, name or tracking #" style="width:250px;" value="${esc(activityFilter.q)}">
        <select id="activityActor" style="width:220px;"><option value="">All staff</option>${staffOpts}</select>
      </div>
      <div class="muted">${list.length} entr${list.length===1?'y':'ies'}${list.length>250?' (showing latest 250)':''}</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Reference</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4"><div class="empty-state">No activity recorded yet.</div></td></tr>`}</tbody>
      </table>
    </div>
  `;
}

/* ============================== Dispatch view ============================== */
function viewDispatch(){
  const readyForRider = state.parcels.filter(p=>p.status==='scanned');
  const outForDelivery = state.parcels.filter(p=>p.status==='out_for_delivery');
  const riderOpts = state.riders.filter(r=>r.active!==false).map(r=>`<option value="${r.id}">${esc(r.name)} — ${esc(r.vehicle||'')}</option>`).join('');

  // Ready-for-dispatch parcels are grouped by route (sender city -> receiver
  // city) so that when several parcels share the same route, staff can
  // select-all-in-route and assign them to one rider in a single action, via
  // the bulk-assign bar below the table, instead of one at a time. The
  // existing per-row rider-select + Assign-to-Rider button is untouched for
  // single-parcel dispatch.
  const routeGroups = [];
  const routeIndex = {};
  readyForRider.forEach(p=>{
    const key = `${p.sender.city}|${p.receiver.city}`;
    if(!(key in routeIndex)){ routeIndex[key] = routeGroups.length; routeGroups.push({ key, label:`${p.sender.city} → ${p.receiver.city}`, parcels:[] }); }
    routeGroups[routeIndex[key]].parcels.push(p);
  });

  const readyRows = routeGroups.map(g=>{
    const groupHeader = g.parcels.length>1 ? `
      <tr class="route-group-header">
        <td colspan="5" style="background:var(--surface-2);">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; font-weight:700; color:var(--ink-soft);">
            <input type="checkbox" data-route-select="${esc(g.key)}">
            Same route &mdash; ${esc(g.label)}: ${g.parcels.length} parcels can be assigned together below
          </label>
        </td>
      </tr>` : '';
    const rows = g.parcels.map(p=>`
      <tr>
        <td><input type="checkbox" data-bulk-check="${esc(p.trackingNumber)}" data-bulk-route="${esc(g.key)}"></td>
        <td>${tnHtml(p.trackingNumber)}</td>
        <td>${esc(p.sender.city)} &rarr; ${esc(p.receiver.city)}</td>
        <td>${esc(p.receiver.name)}</td>
        <td>
          <div style="display:flex; gap:6px;">
            <select style="min-width:170px;" data-rider-select="${esc(p.trackingNumber)}">
              <option value="">Assign rider&hellip;</option>
              ${riderOpts}
            </select>
            <button class="btn btn-sm btn-primary" data-dispatch="${esc(p.trackingNumber)}">Assign to Rider</button>
          </div>
        </td>
      </tr>`).join('');
    return groupHeader + rows;
  }).join('');

  const bulkBar = readyForRider.length ? `
    <div class="card card-pad" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px;">
      <span class="hint" id="bulkSelCount">0 parcels selected</span>
      <select id="bulkRiderSelect" style="max-width:230px;">
        <option value="">Assign selected to rider&hellip;</option>
        ${riderOpts}
      </select>
      <button class="btn btn-sm btn-primary" id="bulkAssignBtn">Assign Selected to Rider</button>
      <span class="hint">Tick the checkboxes above (or "Same route" to grab a whole group) to dispatch several parcels to one rider at once.</span>
    </div>` : '';

  const outRows = outForDelivery.map(p=>`
    <tr>
      <td>${tnHtml(p.trackingNumber)}</td>
      <td>${esc(p.receiver.name)}, ${esc(p.receiver.city)}</td>
      <td>${p.rider ? esc(p.rider.name) : '&mdash;'}</td>
      <td>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-primary" data-deliver="${esc(p.trackingNumber)}">Mark as Delivered</button>
          <button class="btn btn-sm btn-danger" data-exception="${esc(p.trackingNumber)}">Report Issue</button>
        </div>
      </td>
    </tr>`).join('');

  // Rider roster: every rider, every package ever assigned to them (a
  // parcel keeps its rider tag once dispatched, even after it's delivered or
  // flagged an exception — see advanceStatus), and that package's current
  // status — so this doubles as "what is this rider carrying right now" and
  // "what has this rider carried" in one list.
  const riderCards = state.riders.map(r=>{
    const packages = state.parcels
      .filter(p=>p.rider && p.rider.name===r.name)
      .slice().sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));
    const activeCount = packages.filter(p=>p.status==='out_for_delivery').length;
    const shown = packages.slice(0, 10);
    const pkgRows = shown.map(p=>`
      <tr>
        <td>${tnHtml(p.trackingNumber)}</td>
        <td>${esc(p.sender.city)} &rarr; ${esc(p.receiver.city)}</td>
        <td>${esc(p.receiver.name)}</td>
        <td>${pill(p.status)}</td>
      </tr>`).join('');
    return `
      <div class="card card-pad" style="margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <div class="rider-avatar" style="background:var(--accent); color:var(--accent-ink);">${esc(r.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
          <div style="flex:1; min-width:150px;">
            <div style="font-weight:700; font-size:13.5px;">${esc(r.name)}</div>
            <div class="hint">${esc(r.vehicle||'')} &middot; ${esc(r.phone||'')}</div>
          </div>
          <div class="pill tone-${activeCount?'amber':'neutral'}">${activeCount} out now</div>
          <div class="hint">${packages.length} package${packages.length===1?'':'s'} total</div>
        </div>
        ${packages.length ? `
        <div class="table-wrap" style="margin-top:12px;">
          <table>
            <thead><tr><th>Tracking #</th><th>Route</th><th>Receiver</th><th>Status</th></tr></thead>
            <tbody>${pkgRows}</tbody>
          </table>
        </div>
        ${packages.length>shown.length?`<div class="hint" style="margin-top:6px;">+${packages.length-shown.length} more not shown</div>`:''}
        ` : `<div class="hint" style="margin-top:10px;">No packages carried yet.</div>`}
      </div>`;
  }).join('');

  const exceptionModal = exceptionTarget ? renderExceptionModal(exceptionTarget) : '';

  return `
    <div class="section-head" style="margin-top:22px;">
      <div><h2>Dispatch &mdash; Riders &amp; Delivery</h2><div class="muted">Assign scanned parcels to a rider and confirm deliveries.</div></div>
    </div>

    <div class="section-head"><h2 style="font-size:14px;">Ready for dispatch</h2></div>
    <div class="table-wrap" style="margin-bottom:14px;">
      <table>
        <thead><tr><th><input type="checkbox" id="bulkSelectAllVisible" title="Select all"></th><th>Tracking #</th><th>Route</th><th>Receiver</th><th>Assign &amp; dispatch</th></tr></thead>
        <tbody>${readyRows || `<tr><td colspan="5"><div class="empty-state">No scanned parcels waiting for a rider.</div></td></tr>`}</tbody>
      </table>
    </div>
    ${bulkBar}

    <div class="section-head"><h2 style="font-size:14px;">Out for delivery</h2></div>
    <div class="table-wrap" style="margin-bottom:22px;">
      <table>
        <thead><tr><th>Tracking #</th><th>Receiver</th><th>Rider</th><th>Action</th></tr></thead>
        <tbody>${outRows || `<tr><td colspan="4"><div class="empty-state">No parcels currently out for delivery.</div></td></tr>`}</tbody>
      </table>
    </div>

    <div class="section-head"><h2 style="font-size:14px;">Riders &amp; Their Deliveries</h2><div class="muted">Every rider, the packages assigned to them, and each delivery's current status.</div></div>
    <div style="margin-bottom:16px;">${riderCards || `<div class="card"><div class="empty-state">No riders added yet.</div></div>`}</div>
    <div class="card card-pad" style="max-width:420px;">
      <div class="section-head"><h2 style="font-size:13.5px;">Add a rider</h2></div>
      <form id="riderForm">
        <div class="form-grid">
          <div class="field"><label>Name</label><input name="name" required></div>
          <div class="field"><label>Phone</label><input name="phone" required></div>
        </div>
        <div class="field"><label>Vehicle</label><select name="vehicle"><option>Dispatch Bike</option><option>Delivery Van</option><option>Tricycle</option></select></div>
        <button class="btn btn-primary" type="submit">Add rider</button>
      </form>
    </div>
    ${exceptionModal}
  `;
}

/* ============================== Admin view ============================== */
function viewAdmin(){
  const total = state.parcels.length;
  const inTransit = state.parcels.filter(p=>['scanned','out_for_delivery'].includes(p.status)).length;
  const deliveredToday = state.parcels.filter(p=>{
    if(p.status!=='delivered') return false;
    const last = (p.history||[]).slice(-1)[0];
    if(!last) return false;
    return lagosDateKey(last.timestamp) === lagosDateKey(new Date());
  }).length;
  const exceptions = state.parcels.filter(p=>p.status==='exception').length;

  let list = state.parcels;
  if(adminFilter.status) list = list.filter(p=>p.status===adminFilter.status);
  if(adminFilter.q){
    const q = adminFilter.q.toLowerCase();
    list = list.filter(p=> p.trackingNumber.toLowerCase().includes(q) || p.receiver.name.toLowerCase().includes(q) || p.sender.name.toLowerCase().includes(q));
  }

  const rows = list.map(p=>`
    <tr class="row-click" data-detail="${esc(p.trackingNumber)}">
      <td>${tnHtml(p.trackingNumber)}</td>
      <td>${esc(p.sender.city)} &rarr; ${esc(p.receiver.city)}</td>
      <td>${esc(p.receiver.name)}</td>
      <td>${esc(p.serviceType)}</td>
      <td>${pill(p.status)}</td>
      <td class="hint">${fmtWhen(p.updatedAt)}</td>
    </tr>`).join('');

  const statusOpts = STATUS_FLOW.concat(['exception']).map(k=>`<option value="${k}" ${adminFilter.status===k?'selected':''}>${esc(STATUS_META[k].label)}</option>`).join('');

  let modal = '';
  if(adminDetail){
    const p = findParcel(adminDetail);
    if(p) modal = `<div class="overlay" id="detailOverlay"><div class="modal">${renderAdminDetail(p)}</div></div>`;
  }
  const deleteReqModal = deleteRequestTarget ? `<div class="overlay" id="deleteRequestOverlay"><div class="modal" style="max-width:440px;">${renderDeleteRequestModal(deleteRequestTarget)}</div></div>` : '';
  const pendingDeletions = state.deletionRequests.filter(r=>r.status==='pending');
  const deletionPanel = pendingDeletions.length ? renderDeletionRequestsPanel(pendingDeletions) : '';

  return `
    <div class="section-head" style="margin-top:22px;">
      <div><h2>Admin &mdash; Overview</h2><div class="muted">Every parcel, its current status, and full history.</div></div>
    </div>
    <div class="grid-stats">
      <div class="stat-tile"><div class="stat-value">${total}</div><div class="stat-label">Total parcels</div></div>
      <div class="stat-tile"><div class="stat-value">${inTransit}</div><div class="stat-label">In transit</div></div>
      <div class="stat-tile"><div class="stat-value">${deliveredToday}</div><div class="stat-label">Delivered today</div></div>
      <div class="stat-tile"><div class="stat-value" style="color:${exceptions?'var(--red)':'inherit'};">${exceptions}</div><div class="stat-label">Exceptions</div></div>
    </div>

    ${deletionPanel}

    <div class="section-head">
      <h2 style="font-size:14px;">All parcels</h2>
      <div style="display:flex; gap:8px;">
        <input id="adminSearch" placeholder="Search tracking #, sender or receiver" style="width:240px;" value="${esc(adminFilter.q)}">
        <select id="adminStatus" style="width:190px;"><option value="">All statuses</option>${statusOpts}</select>
      </div>
    </div>
    <div class="table-wrap" style="margin-bottom:26px;">
      <table>
        <thead><tr><th>Tracking #</th><th>Route</th><th>Receiver</th><th>Service</th><th>Status</th><th>Updated</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6"><div class="empty-state">No parcels match this filter.</div></td></tr>`}</tbody>
      </table>
    </div>

    <div class="card card-pad" style="max-width:420px;">
      <div class="section-head"><h2 style="font-size:13.5px;">Company settings</h2></div>
      <form id="settingsForm">
        <div class="field"><label>Company name</label><input name="name" value="${esc(state.settings.name)}" required></div>
        <div class="field"><label>Tagline</label><input name="tagline" value="${esc(state.settings.tagline||'')}"></div>
        <div class="field"><label>Tracking number prefix</label><input name="prefix" value="${esc(state.settings.prefix)}" maxlength="6" required style="text-transform:uppercase;"></div>
        <button class="btn btn-primary" type="submit">Save settings</button>
      </form>
    </div>
    ${modal}
    ${deleteReqModal}
  `;
}

function renderDeletionRequestsPanel(list){
  const canApprove = canApproveDeletions(currentUser);
  const rows = list.map(r=>`
    <div class="card card-pad" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;">
        <div style="min-width:220px;">
          <div style="display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px;">${tnHtml(r.trackingNumber)}<span class="pill tone-amber">Pending</span></div>
          <div class="hint" style="margin-top:4px;">Requested by ${esc(r.requestedBy?r.requestedBy.name:'Unknown')}${r.requestedBy&&r.requestedBy.staffId?` (${esc(r.requestedBy.staffId)})`:''} &middot; ${fmtWhen(r.requestedAt)}</div>
          <div class="muted" style="margin-top:6px;">${esc(r.reason)}</div>
        </div>
        ${canApprove ? `
        <div style="display:flex; flex-direction:column; gap:6px; min-width:230px;">
          <input type="text" data-reject-note="${esc(r.id)}" placeholder="Reason if declining (optional)">
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-sm btn-primary" data-approve-deletion="${esc(r.id)}">Approve &amp; delete</button>
            <button type="button" class="btn btn-sm btn-danger" data-reject-deletion="${esc(r.id)}">Decline</button>
          </div>
        </div>` : `<div class="hint" style="align-self:center; white-space:nowrap;">Awaiting admin approval</div>`}
      </div>
    </div>`).join('');
  return `
    <div class="section-head" style="margin-top:4px;">
      <h2 style="font-size:14px; color:var(--red);">Deletion requests</h2>
      <div class="muted">${list.length} pending</div>
    </div>
    ${rows}
  `;
}

function renderDeleteRequestModal(tn){
  const p = findParcel(tn);
  return `
    <button class="modal-close" data-close-delete-request>&times;</button>
    <div class="section-head"><div><h2 style="font-size:15px;">Request deletion</h2><div class="muted" style="margin-top:2px;">${tnHtml(tn)}${p?` &middot; ${esc(p.receiver.name)}`:''}</div></div></div>
    <div class="field" style="margin-top:14px;">
      <label>Reason for deletion</label>
      <textarea id="deleteRequestReason" rows="3" placeholder="e.g. Duplicate booking entered by mistake"></textarea>
    </div>
    <div class="hint">This sends a request to Admin/Superadmin for approval — the record won't be removed until they approve it.</div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
      <button type="button" class="btn btn-sm" data-close-delete-request>Cancel</button>
      <button type="button" class="btn btn-sm btn-danger" id="deleteRequestSubmit" data-submit-delete-request="${esc(tn)}">Submit request</button>
    </div>
  `;
}

function renderAdminDetail(p){
  const chain = getRebookChain(p);
  const hist = renderHistoryTimeline(combinedHistory(p), p.trackingNumber);
  const pendingDeletion = state.deletionRequests.find(r=>r.trackingNumber===p.trackingNumber && r.status==='pending');
  const deletionBlock = pendingDeletion
    ? `<div class="hint" style="margin-top:10px; color:var(--amber);">Deletion requested by ${esc(pendingDeletion.requestedBy?pendingDeletion.requestedBy.name:'a staff member')} — pending Admin/Superadmin approval.</div>`
    : `<button type="button" class="btn btn-sm btn-danger" data-request-deletion="${esc(p.trackingNumber)}" style="margin-top:10px;">Request deletion</button>`;
  return `
    <button class="modal-close" data-close-detail>&times;</button>
    <div class="section-head">
      <div>
        <div class="route-row">${esc(p.sender.city)}<span class="route-arrow">&rarr;</span>${esc(p.receiver.city)}</div>
        <div class="muted">${tnHtml(p.trackingNumber)}</div>
      </div>
      ${pill(p.status)}
    </div>
    <div class="parcel-meta" style="margin-bottom:6px;">
      <span><b>Sender:</b> ${esc(p.sender.name)} &middot; ${esc(p.sender.phone)}${p.sender.email?` &middot; ${esc(p.sender.email)}`:''}</span>
    </div>
    <div class="parcel-meta" style="margin-bottom:6px;">
      <span><b>Receiver:</b> ${esc(p.receiver.name)} &middot; ${esc(p.receiver.phone)}${p.receiver.email?` &middot; ${esc(p.receiver.email)}`:''}</span>
    </div>
    ${p.receiver.address ? `<div class="hint" style="margin-bottom:6px;"><b>Delivery address:</b> ${esc(p.receiver.address)}${p.receiver.landmark?` &middot; near ${esc(p.receiver.landmark)}`:''}</div>` : ''}
    <div class="parcel-meta">
      <span><b>Item:</b> ${esc(p.description)}</span>
      <span><b>Weight:</b> ${esc(p.weightKg)}</span>
      <span><b>Service:</b> ${esc(p.serviceType)}</span>
    </div>
    ${p.rider ? `<div class="rider-card"><div class="rider-avatar">${esc(p.rider.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div><div class="rname">${esc(p.rider.name)}</div><div class="rmeta">${esc(p.rider.phone||'')}</div></div></div>` : ''}
    ${p.rebookedFrom ? `<div class="hint" style="margin-top:6px;">Re-booked after a delivery exception on ${tnHtml(p.rebookedFrom)}.</div>` : ''}
    ${p.rebookedTo ? `<div class="hint" style="margin-top:6px;">This parcel was re-booked as ${tnHtml(p.rebookedTo)} after a delivery exception.</div>` : ''}
    ${p.status==='exception' && !p.rebookedTo ? `<div class="rider-card" style="background:var(--red-soft); border-color:var(--red-line); justify-content:space-between;"><div><div class="rname">Delivery exception</div><div class="rmeta">Re-book to send this delivery back into the warehouse queue under the same tracking number.</div></div><button type="button" class="btn btn-sm btn-primary" data-rebook="${esc(p.trackingNumber)}">Re-book parcel</button></div>` : ''}
    ${deletionBlock}
    ${db ? `<button class="btn btn-sm" data-send-tracking="${esc(p.trackingNumber)}" style="margin-top:10px;">Send tracking ID</button>` : ''}
    ${(p.notifications && p.notifications.length) ? `
    <div class="section-head" style="margin-top:16px;">
      <h2 style="font-size:13px;">Tracking ID notifications</h2>
      <div class="muted" style="font-size:11px;">${p.notifications.length} attempts</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:4px; margin-bottom:6px;">
      ${p.notifications.map(n=>`<div class="hint">${esc(n.channel==='email'?'Email':n.channel || 'Notification')} &middot; ${esc(n.recipientRole)} &middot; ${esc(n.to)} · ${n.delivered ? 'Accepted' : 'Failed'}${n.subject?` &middot; ${esc(n.subject)}`:''}${n.error?` — ${esc(n.error)}`:''}</div>`).join('')}
    </div>` : ''}
    <div class="section-head" style="margin-top:16px;">
      <h2 style="font-size:13px;">Full history</h2>
      ${chain.length>1?`<div class="muted" style="font-size:11px;">Includes ${chain.length} linked bookings for this delivery</div>`:''}
    </div>
    <div class="timeline">${hist}</div>
  `;
}

function renderExceptionModal(tn){
  const p = findParcel(tn);
  return `
    <div class="overlay" id="exceptionOverlay">
      <div class="modal" style="max-width:440px;">
        <button class="modal-close" data-close-exception>&times;</button>
        <div class="section-head"><div><h2 style="font-size:15px;">Report a delivery issue</h2><div class="muted" style="margin-top:2px;">${tnHtml(tn)}${p?` &middot; ${esc(p.receiver.name)}`:''}</div></div></div>
        <div class="field" style="margin-top:14px;">
          <label>Reason</label>
          <select id="exceptionReason">
            ${EXCEPTION_REASONS.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Additional detail (optional)</label>
          <textarea id="exceptionNote" rows="3" placeholder="e.g. Tried calling twice, no response since 10am"></textarea>
        </div>
        <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
          <button type="button" class="btn btn-sm" data-close-exception>Cancel</button>
          <button type="button" class="btn btn-sm btn-danger" id="exceptionSubmit" data-submit-exception="${esc(tn)}">Flag as exception</button>
        </div>
      </div>
    </div>
  `;
}

/* ============================== Event binding ============================== */
function bindView(){
  document.querySelectorAll('[data-send-tracking]').forEach(btn=>btn.addEventListener('click',async()=>{
    btn.disabled=true;
    try{ const result=await callFunction('notify-parcel',{tn:btn.dataset.sendTracking}); bookingConfirm=result; adminDetail=null; currentRole='warehouse'; render(); }
    catch(error){ toast(error.message || 'Could not send tracking ID'); btn.disabled=false; }
  }));
  // Password show/hide toggles (login, admin-user create/edit forms)
  document.querySelectorAll('[data-toggle-pw]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('.pw-wrap');
      const input = wrap ? wrap.querySelector('input') : null;
      if(!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      btn.setAttribute('title', showing ? 'Show password' : 'Hide password');
    });
  });

  // Track view
  const trackBtn = document.getElementById('trackBtn');
  if(trackBtn){
    const input = document.getElementById('trackInput');
    const go = async ()=>{
      const tn = (input.value||'').trim().toUpperCase();
      selectedParcel = tn;
      if(db && !currentUser){
        trackLookup = { tn, loading:true, parcel:null, notFound:false, error:false };
        render();
        try{
          const res = await fetch(`${FUNCTIONS_BASE}/track?tn=${encodeURIComponent(tn)}`, {
            headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}` },
          });
          const data = await res.json().catch(()=>({}));
          if(res.ok && data.parcel) trackLookup = { tn, loading:false, parcel:data.parcel, notFound:false, error:false };
          else trackLookup = { tn, loading:false, parcel:null, notFound:true, error:false };
        }catch(err){
          console.error(err);
          trackLookup = { tn, loading:false, parcel:null, notFound:true, error:true };
        }
        render();
        return;
      }
      render();
    };
    trackBtn.addEventListener('click', go);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    document.querySelectorAll('[data-try]').forEach(el=>{
      el.addEventListener('click', ()=>{ selectedParcel = el.dataset.try; render(); });
    });
  }

  // Warehouse: book form
  const bookForm = document.getElementById('bookForm');
  if(bookForm){
    // Keep the in-progress values mirrored in bookDraft so a live data
    // update elsewhere doesn't erase what's being typed here (see render()).
    bookForm.addEventListener('input', e=>{
      if(e.target && e.target.name && (e.target.name in bookDraft)) bookDraft[e.target.name] = e.target.value;
    });
    bookForm.addEventListener('change', e=>{
      if(e.target && e.target.name && (e.target.name in bookDraft)) bookDraft[e.target.name] = e.target.value;
    });
    bookForm.addEventListener('submit', async e=>{
      e.preventDefault();
      // Two submit buttons share this form (see the template above):
      // "Save Parcel" (data-action="save-only") and "Save & Send Tracking
      // ID" (data-action="save-and-send"). e.submitter tells us which one
      // was actually clicked; on an implicit Enter-key submit (no
      // submitter) we default to sending, matching the old single-button
      // behavior.
      const wantsSend = !e.submitter || e.submitter.dataset.action !== 'save-only';
      const fd = new FormData(bookForm);
      const payload = {
        sender:{ name:fd.get('s_name'), phone:fd.get('s_phone'), email:fd.get('s_email')||'', city:fd.get('s_city') },
        receiver:{
          name:fd.get('r_name'), phone:fd.get('r_phone'), email:fd.get('r_email')||'',
          address:fd.get('r_address'), city:fd.get('r_city'), landmark:fd.get('r_landmark')||'',
        },
        description:fd.get('desc'), weightKg:fd.get('weight'),
        serviceType:fd.get('service'),
        clientId: fd.get('client_id') || null,
        sendNotification: wantsSend,
      };
      const submitBtns = bookForm.querySelectorAll('button[type=submit]');
      const clickedBtn = e.submitter || submitBtns[submitBtns.length-1];
      const clickedLabel = clickedBtn.textContent;
      submitBtns.forEach(b=>b.disabled = true);
      clickedBtn.textContent = wantsSend ? 'Saving & sending…' : 'Saving…';
      try{
        const { tn, notifications, notificationsSkipped } = await createParcel(payload);
        toast(`Parcel booked: ${tn}`);
        bookForm.reset();
        resetBookDraft();
        currentRole = 'warehouse';
        bookingConfirm = { tn, notifications, notificationsSkipped: !!notificationsSkipped };
      }catch(err){ console.error(err); toast(err.message || 'Could not book parcel'); }
      submitBtns.forEach(b=>b.disabled = false);
      clickedBtn.textContent = clickedLabel;
      render();
    });
    const clientSelect = document.getElementById('clientSelect');
    if(clientSelect){
      clientSelect.addEventListener('change', ()=>{
        if(clientSelect.value) applyClient(clientSelect.value);
        else clearSenderFields();
      });
    }
    const saveSenderBtn = document.getElementById('saveSenderBtn');
    if(saveSenderBtn){
      saveSenderBtn.addEventListener('click', async ()=>{
        const name = bookForm.s_name.value.trim();
        const phone = bookForm.s_phone.value.trim();
        const email = bookForm.s_email ? bookForm.s_email.value.trim() : '';
        const city = bookForm.s_city.value.trim();
        if(!name || !phone || !city){ toast('Fill in the sender\'s name, phone and city first'); return; }
        const dupe = state.clients.find(c=> c.name.toLowerCase()===name.toLowerCase() && c.phone===phone);
        if(dupe){ toast(`${name} is already a saved frequent sender`); return; }
        saveSenderBtn.disabled = true;
        try{
          await addClient({ name, phone, email, city, createdAt:new Date().toISOString() });
          toast(`Saved ${name} as a frequent sender`);
        }catch(err){ console.error(err); toast('Could not save sender'); saveSenderBtn.disabled = false; }
      });
    }
  }
  document.querySelectorAll('[data-close-booking-confirm]').forEach(b=>{
    b.addEventListener('click', ()=>{ bookingConfirm = null; render(); });
  });

  // Clients
  const clientForm = document.getElementById('clientForm');
  if(clientForm){
    clientForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(clientForm);
      const data = { name:fd.get('name'), phone:fd.get('phone'), city:fd.get('city'), createdAt:new Date().toISOString() };
      await addClient(data);
      toast(`Client saved: ${data.name}`);
      clientForm.reset();
    });
  }
  document.querySelectorAll('[data-use-client]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentRole = 'warehouse';
      document.querySelectorAll('#roleNav button').forEach(b=>b.classList.toggle('active', b.dataset.role==='warehouse'));
      render();
      applyClient(btn.dataset.useClient);
    });
  });
  document.querySelectorAll('[data-remove-client]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Remove this client? Parcels already booked under them are unaffected.')) return;
      await deleteClient(btn.dataset.removeClient);
      toast('Client removed');
    });
  });
  document.querySelectorAll('[data-receive-instore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tn = btn.dataset.receiveInstore;
      btn.disabled = true;
      try{ await receiveInStore(tn); toast(`${tn} marked Received In-Store — ready for dispatch`); }
      catch(err){ console.error(err); toast('Could not update parcel'); btn.disabled = false; }
    });
  });

  // Dispatch
  document.querySelectorAll('[data-dispatch]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tn = btn.dataset.dispatch;
      const sel = document.querySelector(`[data-rider-select="${CSS.escape(tn)}"]`);
      const riderId = sel ? sel.value : '';
      if(!riderId){ toast('Choose a rider first'); return; }
      const rider = state.riders.find(r=>r.id===riderId);
      btn.disabled = true;
      await advanceStatus(tn, 'out_for_delivery', { location:(rider?rider.vehicle:'')+' en route', actor:'Dispatch', note:`Rider: ${rider?rider.name:''}`, riderId, rider:{ name:rider?rider.name:'', phone:rider?rider.phone:'' } });
      toast(`${tn} dispatched with ${rider?rider.name:'rider'}`);
    });
  });

  // Bulk-assign: dispatch several selected parcels — typically all sharing
  // the same route via the "Same route" group checkbox — to one rider in a
  // single action, instead of assigning them one at a time.
  const updateBulkSelCount = ()=>{
    const countEl = document.getElementById('bulkSelCount');
    if(!countEl) return;
    const n = document.querySelectorAll('[data-bulk-check]:checked').length;
    countEl.textContent = `${n} parcel${n===1?'':'s'} selected`;
  };
  document.querySelectorAll('[data-route-select]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.routeSelect;
      document.querySelectorAll(`[data-bulk-check][data-bulk-route="${CSS.escape(key)}"]`).forEach(c=>{ c.checked = cb.checked; });
      updateBulkSelCount();
    });
  });
  document.querySelectorAll('[data-bulk-check]').forEach(cb=>{
    cb.addEventListener('change', updateBulkSelCount);
  });
  const bulkSelectAllVisible = document.getElementById('bulkSelectAllVisible');
  if(bulkSelectAllVisible){
    bulkSelectAllVisible.addEventListener('change', ()=>{
      document.querySelectorAll('[data-bulk-check]').forEach(c=>{ c.checked = bulkSelectAllVisible.checked; });
      document.querySelectorAll('[data-route-select]').forEach(c=>{ c.checked = bulkSelectAllVisible.checked; });
      updateBulkSelCount();
    });
  }
  const bulkAssignBtn = document.getElementById('bulkAssignBtn');
  if(bulkAssignBtn){
    bulkAssignBtn.addEventListener('click', async ()=>{
      const tns = Array.from(document.querySelectorAll('[data-bulk-check]:checked')).map(c=>c.dataset.bulkCheck);
      const riderSel = document.getElementById('bulkRiderSelect');
      const riderId = riderSel ? riderSel.value : '';
      if(!tns.length){ toast('Select at least one parcel to assign'); return; }
      if(!riderId){ toast('Choose a rider first'); return; }
      const rider = state.riders.find(r=>r.id===riderId);
      bulkAssignBtn.disabled = true;
      try{
        for(const tn of tns){
          await advanceStatus(tn, 'out_for_delivery', { location:(rider?rider.vehicle:'')+' en route', actor:'Dispatch', note:`Rider: ${rider?rider.name:''}`, riderId, rider:{ name:rider?rider.name:'', phone:rider?rider.phone:'' } });
        }
        toast(`${tns.length} parcel${tns.length===1?'':'s'} dispatched with ${rider?rider.name:'rider'}`);
      }catch(err){ console.error(err); toast('Could not dispatch selected parcels'); bulkAssignBtn.disabled = false; }
    });
  }
  document.querySelectorAll('[data-deliver]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tn = btn.dataset.deliver;
      const p = findParcel(tn);
      btn.disabled = true;
      await advanceStatus(tn, 'delivered', { location:p?p.receiver.city:'', actor:'Dispatch', note:'Confirmed by recipient' });
      toast(`${tn} marked delivered`);
    });
  });
  document.querySelectorAll('[data-exception]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      exceptionTarget = btn.dataset.exception;
      render();
    });
  });
  // Report-issue modal
  const exceptionOverlay = document.getElementById('exceptionOverlay');
  if(exceptionOverlay){
    const closeException = ()=>{ exceptionTarget = null; render(); };
    document.querySelectorAll('[data-close-exception]').forEach(b=>b.addEventListener('click', closeException));
    exceptionOverlay.addEventListener('click', e=>{ if(e.target===exceptionOverlay) closeException(); });
    const submitBtn = document.getElementById('exceptionSubmit');
    if(submitBtn){
      submitBtn.addEventListener('click', async ()=>{
        const tn = submitBtn.dataset.submitException;
        const reasonEl = document.getElementById('exceptionReason');
        const noteEl = document.getElementById('exceptionNote');
        const reason = reasonEl ? reasonEl.value : 'Delivery issue reported';
        const extra = noteEl && noteEl.value.trim() ? ` — ${noteEl.value.trim()}` : '';
        submitBtn.disabled = true; submitBtn.textContent = 'Flagging…';
        try{
          await advanceStatus(tn, 'exception', { location:'', actor:'Dispatch', note: reason + extra });
          exceptionTarget = null;
          render();
          toast(`${tn} flagged as exception`);
          const flaggedParcel = findParcel(tn);
          notifyRole(['admin','superadmin'], {
            title:'Delivery exception reported',
            body:`${tn}${flaggedParcel?` (${flaggedParcel.receiver.name})`:''} was flagged: ${reason}`,
            kind:'exception', refType:'parcel', refId:tn,
          });
        }catch(err){ console.error(err); toast('Could not flag parcel'); submitBtn.disabled = false; submitBtn.textContent = 'Flag as exception'; }
      });
    }
  }
  const riderForm = document.getElementById('riderForm');
  if(riderForm){
    riderForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(riderForm);
      await addRider({ name:fd.get('name'), phone:fd.get('phone'), vehicle:fd.get('vehicle'), active:true });
      toast('Rider added');
      riderForm.reset();
    });
  }

  // Admin
  const aSearch = document.getElementById('adminSearch');
  const aStatus = document.getElementById('adminStatus');
  if(aSearch) aSearch.addEventListener('input', ()=>{ adminFilter.q = aSearch.value; render(); aSearch2Focus(); });
  if(aStatus) aStatus.addEventListener('change', ()=>{ adminFilter.status = aStatus.value; render(); });
  document.querySelectorAll('[data-detail]').forEach(tr=>{
    tr.addEventListener('click', ()=>{ adminDetail = tr.dataset.detail; render(); });
  });
  const closeBtn = document.querySelector('[data-close-detail]');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ adminDetail = null; render(); });
  const overlay = document.getElementById('detailOverlay');
  if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ adminDetail = null; render(); } });
  const rebookBtn = document.querySelector('[data-rebook]');
  if(rebookBtn){
    rebookBtn.addEventListener('click', async ()=>{
      rebookBtn.disabled = true; rebookBtn.textContent = 'Re-booking…';
      try{ await rebookParcel(rebookBtn.dataset.rebook); }
      catch(err){ console.error(err); toast('Could not re-book parcel'); rebookBtn.disabled = false; rebookBtn.textContent = 'Re-book parcel'; }
    });
  }

  // Parcel-deletion requests: any logged-in role can request; only Admin /
  // Superadmin can approve (deletes for real) or decline.
  document.querySelectorAll('[data-request-deletion]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ deleteRequestTarget = btn.dataset.requestDeletion; render(); });
  });
  const deleteReqOverlay = document.getElementById('deleteRequestOverlay');
  if(deleteReqOverlay){
    const closeDeleteReq = ()=>{ deleteRequestTarget = null; render(); };
    document.querySelectorAll('[data-close-delete-request]').forEach(b=>b.addEventListener('click', closeDeleteReq));
    deleteReqOverlay.addEventListener('click', e=>{ if(e.target===deleteReqOverlay) closeDeleteReq(); });
    const submitDelReq = document.getElementById('deleteRequestSubmit');
    if(submitDelReq){
      submitDelReq.addEventListener('click', async ()=>{
        const tn = submitDelReq.dataset.submitDeleteRequest;
        const reasonEl = document.getElementById('deleteRequestReason');
        const reason = reasonEl ? reasonEl.value.trim() : '';
        if(!reason){ toast('Please describe the reason for deletion'); return; }
        submitDelReq.disabled = true; submitDelReq.textContent = 'Submitting…';
        try{
          await requestParcelDeletion(tn, reason);
          deleteRequestTarget = null;
          render();
          toast('Deletion request sent for approval');
        }catch(err){ console.error(err); toast('Could not submit request'); submitDelReq.disabled = false; submitDelReq.textContent = 'Submit request'; }
      });
    }
  }
  document.querySelectorAll('[data-approve-deletion]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.approveDeletion;
      const req = state.deletionRequests.find(r=>r.id===id);
      if(!req) return;
      if(!confirm(`Permanently delete parcel ${req.trackingNumber}? This cannot be undone.`)) return;
      btn.disabled = true;
      try{ await resolveDeletionRequest(id, 'approved', ''); toast(`${req.trackingNumber} deleted`); render(); }
      catch(err){ console.error(err); toast('Could not delete parcel'); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-reject-deletion]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.rejectDeletion;
      const noteInput = document.querySelector(`[data-reject-note="${CSS.escape(id)}"]`);
      const note = noteInput ? noteInput.value.trim() : '';
      btn.disabled = true;
      try{ await resolveDeletionRequest(id, 'rejected', note); toast('Deletion request declined'); render(); }
      catch(err){ console.error(err); toast('Could not update request'); btn.disabled = false; }
    });
  });

  const settingsForm = document.getElementById('settingsForm');
  if(settingsForm){
    settingsForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(settingsForm);
      await saveSettings({ name:fd.get('name'), tagline:fd.get('tagline'), prefix:(fd.get('prefix')||'TRK').toUpperCase() });
      toast('Settings saved');
    });
  }

  // Staff login
  const loginForm = document.getElementById('loginForm');
  if(loginForm){
    loginForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(loginForm);
      const staffId = (fd.get('staffId')||'').trim().toUpperCase();
      const password = fd.get('password')||'';
      const btn = loginForm.querySelector('button[type=submit]');

      if(!db){
        // Local demo mode — no backend configured, fall back to the
        // plaintext check against the seeded in-memory admins.
        const found = state.admins.find(a=> (a.staffId||'').toUpperCase()===staffId && a.password===password);
        if(!found){ loginError = 'Staff ID or password not recognized.'; render(); return; }
        if(found.active===false){ loginError = 'This login has been deactivated. See a superadmin.'; render(); return; }
        currentUser = { id:found.id, name:found.name, staffId:found.staffId, role:found.role };
        loginError = '';
        try{ localStorage.setItem('stk_admin_session', found.id); }catch(e){}
        render();
        toast(`Welcome, ${found.name}`);
        logActivity('login', { summary:`${found.name} logged in` });
        return;
      }

      // Real backend — the Staff ID / password form stays the same, but
      // it's now a real Supabase Auth sign-in under the hood (staffId maps
      // to a synthetic "<staffid>@staff.stallionking.internal" email).
      if(btn) btn.disabled = true;
      const email = staffId.toLowerCase()+'@staff.stallionking.internal';
      const { data, error } = await db._client.auth.signInWithPassword({ email, password });
      if(error || !data.session){
        loginError = 'Staff ID or password not recognized.';
        if(btn) btn.disabled = false;
        render();
        return;
      }
      const { data:profileRow } = await db._client.from('profiles').select('admin_doc_id').eq('user_id', data.user.id).maybeSingle();
      const { data:adminRow } = profileRow
        ? await db._client.from('admins').select('id, data').eq('id', profileRow.admin_doc_id).maybeSingle()
        : { data:null };
      if(!adminRow || adminRow.data.active===false){
        await db._client.auth.signOut();
        loginError = adminRow ? 'This login has been deactivated. See a superadmin.' : 'Staff ID or password not recognized.';
        if(btn) btn.disabled = false;
        render();
        return;
      }
      currentUser = { id:adminRow.id, name:adminRow.data.name, staffId:adminRow.data.staffId, role:adminRow.data.role };
      loginError = '';
      subscribe();
      render();
      toast(`Welcome, ${adminRow.data.name}`);
      logActivity('login', { summary:`${adminRow.data.name} logged in` });
    });
  }

  // Admin Users (superadmin) — create
  const adminUserForm = document.getElementById('adminUserForm');
  if(adminUserForm){
    adminUserForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(adminUserForm);
      const staffId = (fd.get('staffId')||'').trim().toUpperCase();
      const name = (fd.get('name')||'').trim();
      const password = fd.get('password')||'';
      const role = parseRoleField(fd.get('role'));
      if(state.admins.some(a=>(a.staffId||'').toUpperCase()===staffId)){ toast(`Staff ID ${staffId} is already in use`); return; }
      const btn = adminUserForm.querySelector('button[type=submit]');
      btn.disabled = true;
      try{
        if(db){
          // Real backend: creates a real Supabase Auth user for the
          // password (see supabase/functions/create-staff) instead of
          // storing it in plaintext.
          await callFunction('create-staff', { name, staffId, password, role });
        } else {
          await addAdmin({ name, staffId, password, role, active:true, createdAt:new Date().toISOString() });
        }
        toast(`Login created for ${name}`);
        adminUserForm.reset();
        logActivity('admin_created', { summary:`Created a new login for ${name} (${staffId}) — role: ${roleLabel(role)}`, targetType:'admin', targetId:staffId });
      }catch(err){ console.error(err); toast(err.message || 'Could not create login'); }
      btn.disabled = false;
    });
  }
  document.querySelectorAll('[data-view-activity]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activityFilter = { q:'', actorId: btn.dataset.viewActivity };
      currentRole = 'activity';
      render();
    });
  });
  document.querySelectorAll('[data-edit-admin]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminUserModal = btn.dataset.editAdmin; render(); });
  });
  document.querySelectorAll('[data-toggle-admin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.toggleAdmin;
      const makeActive = btn.dataset.nextActive === 'true';
      const a = findAdminById(id);
      if(!makeActive && a && a.role==='superadmin' && activeSuperadminCount(id)===0){
        toast('At least one active superadmin login is required'); return;
      }
      btn.disabled = true;
      try{
        await updateAdmin(id, { active: makeActive });
        toast(makeActive?'Login reactivated':'Login deactivated');
        logActivity(makeActive?'admin_reactivated':'admin_deactivated', { summary:`${makeActive?'Reactivated':'Deactivated'} the login for ${a?a.name:id}${a?` (${a.staffId})`:''}`, targetType:'admin', targetId: a?a.staffId:id });
      }
      catch(err){ console.error(err); toast('Could not update login'); btn.disabled = false; }
    });
  });
  document.querySelectorAll('[data-delete-admin]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.deleteAdmin;
      const a = findAdminById(id);
      if(a && a.role==='superadmin' && activeSuperadminCount(id)===0){
        toast('At least one active superadmin login is required'); return;
      }
      if(!confirm(`Delete the login for ${a?a.name:'this admin'}? This cannot be undone.`)) return;
      try{
        await deleteAdmin(id);
        toast('Login deleted');
        logActivity('admin_deleted', { summary:`Deleted the login for ${a?a.name:id}${a?` (${a.staffId})`:''}`, targetType:'admin', targetId: a?a.staffId:id });
      }
      catch(err){ console.error(err); toast('Could not delete login'); }
    });
  });
  const closeAdminUser = ()=>{ adminUserModal = null; render(); };
  document.querySelectorAll('[data-close-admin-user]').forEach(b=>b.addEventListener('click', closeAdminUser));
  const adminUserOverlay = document.getElementById('adminUserOverlay');
  if(adminUserOverlay) adminUserOverlay.addEventListener('click', e=>{ if(e.target===adminUserOverlay) closeAdminUser(); });
  const editAdminForm = document.getElementById('editAdminForm');
  if(editAdminForm){
    editAdminForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const id = editAdminForm.dataset.id;
      const fd = new FormData(editAdminForm);
      const staffId = (fd.get('staffId')||'').trim().toUpperCase(); // read-only field — sent back unchanged
      const name = (fd.get('name')||'').trim();
      const password = fd.get('password')||'';
      const role = parseRoleField(fd.get('role'));
      const current = findAdminById(id);
      if(current && current.role==='superadmin' && role!=='superadmin' && activeSuperadminCount(id)===0){
        toast('At least one active superadmin login is required'); return;
      }
      const btn = editAdminForm.querySelector('button[type=submit]');
      btn.disabled = true;
      try{
        if(db){
          // Password and role changes go through update-staff — the
          // password touches Supabase Auth, and the role has to stay in
          // sync with profiles.role, which is what the edge functions and
          // RLS policies actually check server-side.
          if(password || (current && role!==current.role)){
            await callFunction('update-staff', { staffId, newPassword: password || undefined, role });
          }
          if(!current || name !== current.name){
            await updateAdmin(id, { name });
          }
        } else {
          const patch = { name, staffId, role };
          if(password) patch.password = password;
          await updateAdmin(id, patch);
        }
        toast('Login updated');
        logActivity('admin_updated', { summary:`Updated the login for ${name} (${staffId})`, targetType:'admin', targetId:staffId });
        adminUserModal = null;
        render();
      }catch(err){ console.error(err); toast(err.message || 'Could not update login'); btn.disabled = false; }
    });
  }

  // Activity Log (superadmin only)
  const actSearch = document.getElementById('activitySearch');
  const actActor = document.getElementById('activityActor');
  if(actSearch) actSearch.addEventListener('input', ()=>{ activityFilter.q = actSearch.value; render(); actSearchFocus(); });
  if(actActor) actActor.addEventListener('change', ()=>{ activityFilter.actorId = actActor.value; render(); });
  const activityClearActorBtn = document.getElementById('activityClearActor');
  if(activityClearActorBtn) activityClearActorBtn.addEventListener('click', ()=>{ activityFilter.actorId = ''; render(); });
  document.querySelectorAll('[data-activity-goto]').forEach(tr=>{
    tr.addEventListener('click', ()=>{ currentRole = 'admin'; adminDetail = tr.dataset.activityGoto; render(); });
  });
}
function aSearch2Focus(){
  const el = document.getElementById('adminSearch');
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}
function actSearchFocus(){
  const el = document.getElementById('activitySearch');
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}
</script>
</body>
</html>
