<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stallionking Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F4F7F5; --border:#D9E1DC;
    --ink:#142520; --ink-soft:#526059; --ink-faint:#8A968F;
    --accent:#0F6E5C; --accent-ink:#FFFFFF; --accent-soft:#E1F0EA; --accent-line:#BFE0D3;
    --amber:#B96A1E; --amber-soft:#FBEEDD; --amber-line:#EBC996;
    --blue:#2A5FA5; --blue-soft:#E6EEF8; --blue-line:#BFD5EE;
    --red:#AE3527; --red-soft:#FBEAE7; --red-line:#EFC1B8;
    --green:#1E7A45; --green-soft:#E5F3EA; --green-line:#B9DEC5;
    --neutral-soft:#EAEDEB; --neutral-line:#D3DAD6;
    --shadow:0 1px 2px rgba(20,37,32,.06), 0 6px 16px rgba(20,37,32,.06);
    --radius:12px; --radius-sm:8px;
    --font-body:'Libre Franklin',ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1512; --surface:#152019; --surface-2:#1B2721;
      --border:#2A3A33; --ink:#E9F1EC; --ink-soft:#A8BAB1; --ink-faint:#71847B;
      --accent:#49D9AF; --accent-ink:#062A20; --accent-soft:#163B30; --accent-line:#265A48;
      --amber:#E7A758; --amber-soft:#3A2A15; --amber-line:#6B4C22;
      --blue:#82B2EA; --blue-soft:#17293C; --blue-line:#2E4A6B;
      --red:#EA8A7C; --red-soft:#3A1D18; --red-line:#6E3128;
      --green:#74D89A; --green-soft:#153524; --green-line:#2C5B3E;
      --neutral-soft:#22302A; --neutral-line:#3A4A42;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1512; --surface:#152019; --surface-2:#1B2721;
    --border:#2A3A33; --ink:#E9F1EC; --ink-soft:#A8BAB1; --ink-faint:#71847B;
    --accent:#49D9AF; --accent-ink:#062A20; --accent-soft:#163B30; --accent-line:#265A48;
    --amber:#E7A758; --amber-soft:#3A2A15; --amber-line:#6B4C22;
    --blue:#82B2EA; --blue-soft:#17293C; --blue-line:#2E4A6B;
    --red:#EA8A7C; --red-soft:#3A1D18; --red-line:#6E3128;
    --green:#74D89A; --green-soft:#153524; --green-line:#2C5B3E;
    --neutral-soft:#22302A; --neutral-line:#3A4A42;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 20px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); margin:0;}
  h1,h2,h3{font-weight:700; text-wrap:balance; margin:0;}
  button{font-family:inherit;}
  ::selection{ background:var(--accent-soft); }

  .wrap{max-width:1180px; margin:0 auto; padding:0 20px 64px;}

  /* ---------- Top bar ---------- */
  .topbar{border-bottom:1px solid var(--border); background:var(--surface);}
  .topbar-inner{max-width:1180px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px; height:38px; border-radius:9px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;}
  .brand-mark img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand-name{font-size:17px; font-weight:800; letter-spacing:-.01em;}
  .brand-tagline{font-size:12.5px; color:var(--ink-soft);}
  .clock{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); white-space:nowrap;}

  .nav{display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:4px; overflow-x:auto; max-width:100%;}
  .nav button{border:0; background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:600; padding:8px 14px; border-radius:7px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px;}
  .nav button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .nav button:hover:not(.active){color:var(--ink);}
  .nav-bar-row{max-width:1180px; margin:0 auto; padding:14px 20px 0;}

  /* ---------- Generic ---------- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-pad{padding:20px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .section-head h2{font-size:16px;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .hint{color:var(--ink-faint); font-size:12.5px;}

  .btn{border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; line-height:1.2;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.05); border-color:var(--accent);}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .btn-danger{color:var(--red); border-color:var(--red-line); background:var(--red-soft);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:5px;}
  input,select,textarea{width:100%; font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field{margin-bottom:12px;}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 14px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  fieldset{border:1px solid var(--border); border-radius:10px; padding:14px 14px 2px; margin:0 0 14px;}
  legend{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:0 6px;}

  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; border:1px solid; white-space:nowrap;}
  .pill-dot{width:6px; height:6px; border-radius:99px; background:currentColor;}
  .tone-neutral{background:var(--neutral-soft); border-color:var(--neutral-line); color:var(--ink-soft);}
  .tone-blue{background:var(--blue-soft); border-color:var(--blue-line); color:var(--blue);}
  .tone-amber{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .tone-green{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .tone-red{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}

  .grid-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:800px){ .grid-stats{grid-template-columns:repeat(2,1fr);} }
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat-value{font-family:var(--font-mono); font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12px; color:var(--ink-soft); margin-top:4px;}

  .table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
  table{width:100%; border-collapse:collapse; background:var(--surface); font-size:13px;}
  th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  tr.row-click{cursor:pointer;}
  tr.row-click:hover td{background:var(--surface-2);}
  .tn{font-family:var(--font-mono); font-weight:600; letter-spacing:.01em;}

  .empty-state{padding:36px 20px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- Track view ---------- */
  .track-hero{padding:34px 0 8px;}
  .track-hero h1{font-size:26px; margin-bottom:6px;}
  .search-row{display:flex; gap:8px; margin-top:16px;}
  .search-row input{font-family:var(--font-mono); font-size:15px; padding:12px 14px; text-transform:uppercase;}
  .search-row .btn{padding:0 20px; font-size:14px;}
  .chips{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .chip{font-family:var(--font-mono); font-size:11.5px; border:1px dashed var(--border); color:var(--ink-soft); background:var(--surface-2); padding:5px 10px; border-radius:99px; cursor:pointer;}
  .chip:hover{border-color:var(--accent); color:var(--accent);}

  .route-row{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; margin-bottom:4px; flex-wrap:wrap;}
  .route-arrow{color:var(--ink-faint); font-weight:400;}
  .parcel-meta{display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 4px; font-size:12.5px; color:var(--ink-soft);}
  .parcel-meta b{color:var(--ink); font-weight:600;}

  .stepper{display:flex; align-items:flex-start; margin:22px 0 6px; overflow-x:auto;}
  .stepper-step{flex:1; min-width:88px; text-align:center; position:relative;}
  .stepper-step .dot{width:26px; height:26px; border-radius:99px; background:var(--neutral-soft); border:2px solid var(--neutral-line); color:var(--ink-faint); display:flex; align-items:center; justify-content:center; margin:0 auto 6px; font-size:12px; font-weight:700;}
  .stepper-step.done .dot{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .stepper-step.current .dot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .stepper-step.failed .dot{background:var(--red-soft); border-color:var(--red); color:var(--red);}
  .stepper-step .lbl{font-size:11px; color:var(--ink-soft); line-height:1.25; padding:0 4px;}
  .stepper-step.done .lbl,.stepper-step.current .lbl{color:var(--ink); font-weight:600;}
  .stepper-step.failed .lbl{color:var(--red); font-weight:600;}
  .stepper-line{position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--neutral-line); z-index:0;}
  .stepper-step.done .stepper-line{background:var(--accent);}
  .stepper-step.failed .stepper-line{background:var(--red);}
  .stepper-step:first-child .stepper-line{display:none;}
  .stepper-step .dot{position:relative; z-index:1;}

  .rider-card{display:flex; align-items:center; gap:12px; background:var(--amber-soft); border:1px solid var(--amber-line); border-radius:10px; padding:12px 14px; margin:16px 0;}
  .rider-avatar{width:36px; height:36px; border-radius:99px; background:var(--amber); color:var(--surface); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}
  .rider-card .rname{font-weight:700; font-size:13.5px;}
  .rider-card .rmeta{font-size:12px; color:var(--ink-soft);}

  .timeline{margin-top:20px;}
  .t-step{display:flex; gap:14px; position:relative; padding-bottom:22px;}
  .t-step:last-child{padding-bottom:0;}
  .t-step-line{position:absolute; left:11px; top:24px; bottom:0; width:2px; background:var(--border);}
  .t-step:last-child .t-step-line{display:none;}
  .t-dot{width:24px; height:24px; border-radius:99px; flex-shrink:0; display:flex; align-items:center; justify-content:center; z-index:1; border:2px solid;}
  .t-body{flex:1; padding-top:2px;}
  .t-label{font-weight:700; font-size:13.5px;}
  .t-when{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
  .t-loc{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .t-note{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-style:italic;}
  .t-actor{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); background:var(--surface-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; margin-top:5px;}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(10,18,15,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); max-width:640px; width:100%; padding:24px;}
  .modal-close{float:right; border:0; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:18px; line-height:1; padding:2px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 18px; border-radius:9px; box-shadow:var(--shadow); z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .connbar{background:var(--amber-soft); color:var(--amber); border-bottom:1px solid var(--amber-line); font-size:12.5px; text-align:center; padding:6px; display:none;}
  .connbar.show{display:block;}

  /* ---------- Clients ---------- */
  .client-card{display:flex; align-items:center; gap:12px;}
  .client-avatar{width:36px; height:36px; border-radius:99px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;}

  /* ---------- Auth / accounts ---------- */
  .account-badge{display:flex; align-items:center; gap:9px; background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:5px 6px 5px 13px;}
  .account-badge .who{font-size:12px; line-height:1.3;}
  .account-badge .who b{font-weight:700; color:var(--ink); font-size:12.5px;}
  .account-badge .role-tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--accent);}
  .login-wrap{max-width:380px; margin:44px auto 0;}
  .login-wrap h1{font-size:20px; margin-bottom:4px;}
  .staffid{font-family:var(--font-mono); font-weight:700; letter-spacing:.02em;}
  .admin-card{display:flex; align-items:center; gap:12px;}
  .admin-avatar{width:36px; height:36px; flex-shrink:0;}
  .demo-note{font-size:12px; color:var(--ink-faint); background:var(--surface-2); border:1px dashed var(--border); border-radius:8px; padding:8px 10px; margin-top:10px;}

  /* ---------- Top-right: notifications + profile ---------- */
  .topright{display:flex; align-items:center; gap:8px;}
  .icon-btn-wrap{position:relative;}
  .icon-btn{position:relative; border:1px solid var(--border); background:var(--surface); border-radius:99px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); padding:0;}
  .icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
  .badge-dot{position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--surface); line-height:1;}
  .avatar-btn{border:0; background:transparent; padding:0; cursor:pointer; border-radius:99px; line-height:0;}
  .dropdown-panel{position:absolute; top:44px; right:0; width:320px; max-width:88vw; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); z-index:60; overflow:hidden;}
  .dropdown-head{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border);}
  .dropdown-head h3{font-size:13.5px;}
  .link-btn{border:0; background:transparent; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; padding:2px; white-space:nowrap;}
  .notif-list{max-height:360px; overflow-y:auto;}
  .notif-item{display:flex; gap:10px; width:100%; text-align:left; border:0; background:transparent; padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--border); font-family:inherit;}
  .notif-item:last-child{border-bottom:0;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item.unread{background:var(--accent-soft);}
  .notif-dot{width:8px; height:8px; border-radius:99px; background:var(--accent); margin-top:5px; flex-shrink:0;}
  .notif-body{flex:1; min-width:0;}
  .notif-title{font-weight:700; font-size:12.5px; color:var(--ink);}
  .notif-text{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .notif-when{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:4px;}
  .profile-panel-top{display:flex; gap:10px; align-items:center; padding:14px;}
  .profile-panel-body{padding:0 14px 14px;}

  /* ---------- Copy-to-clipboard ---------- */
  .tn-copy{display:inline-flex; align-items:center; gap:4px; cursor:pointer;}
  .tn-copy svg{color:var(--ink-faint); flex-shrink:0;}
  .tn-copy:hover svg{color:var(--accent);}
  .tn-copy:hover .tn{color:var(--accent);}

  /* ---------- Password show/hide toggle ---------- */
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:38px;}
  .pw-toggle{position:absolute; top:50%; right:4px; transform:translateY(-50%); border:0; background:transparent; color:var(--ink-faint); cursor:pointer; padding:6px; display:flex; align-items:center; justify-content:center; border-radius:6px; line-height:0;}
  .pw-toggle:hover{color:var(--ink); background:var(--surface-2);}

  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="connbar" id="connbar">Connecting to shared data…</div>

<div class="topbar">
  <div class="topbar-inner">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-adapter.js"></script>
<script src="config.js"></script>

<script>
/* ============================== Backend configuration ==============================
   Fill these in after creating your Supabase project (Project Settings →
   API). The anon key is safe to expose in the browser by design — it's
   what Row Level Security exists to constrain. Never put the service role
   key here or anywhere in this file. */
const SUPABASE_URL = window.TRACKER_CONFIG?.supabaseUrl || '';
const SUPABASE_ANON_KEY = window.TRACKER_CONFIG?.supabaseAnonKey || '';
const FUNCTIONS_BASE = SUPABASE_URL.replace(/\/$/, '') + '/functions/v1';
function backendConfigured(){
  return /^https?:\/\//.test(SUPABASE_URL) && !!SUPABASE_ANON_KEY;
}
// Calls a Supabase Edge Function, attaching the signed-in staff member's
// session token so the function can authorize the request server-side
// (see supabase/functions/*/index.ts). Used for anything that must run
// with the service role key — booking (real email), and staff-login
// management — never done directly from the browser.
async function callFunction(name, body){
  let accessToken = '';
  if(db){
    const { data:{ session } } = await db._client.auth.getSession();
    accessToken = session ? session.access_token : '';
  }
  const res = await fetch(`${FUNCTIONS_BASE}/${name}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`,

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genCode(len){
  let out = '';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(let i=0;i<len;i++) out += CODE_CHARS[arr[i] % CODE_CHARS.length];
  return out;
}

// After the admins list first loads, try to silently resume whichever staff
// profile this browser last logged in as (a light per-viewer convenience —
// nothing sensitive like a password is kept, just the profile id).
function tryRestoreSession(){
  if(sessionRestoreTried || currentUser) return;
  sessionRestoreTried = true;
  try{
    const savedId = localStorage.getItem('stk_admin_session');
    if(!savedId) return;
    const found = findAdminById(savedId);
    if(found && found.active!==false){
      currentUser = { id:found.id, name:found.name, staffId:found.staffId, role:found.role };
    } else {
      localStorage.removeItem('stk_admin_session');
    }
  }catch(e){ /* storage unavailable — just skip session resume */ }
}
// Real-backend equivalent of tryRestoreSession(): Supabase Auth persists
// its own session (in this browser's localStorage, managed by
// supabase-js), so on reload we just ask it who's signed in and resolve
// their staff profile — no separate stk_admin_session flag needed.
async function restoreSupabaseSession(){
  if(sessionRestoreTried || currentUser) return;
  sessionRestoreTried = true;
  try{
    const { data:{ session } } = await db._client.auth.getSession();
    if(!session) return;
    const { data:profile } = await db._client.from('profiles').select('admin_doc_id').eq('user_id', session.user.id).maybeSingle();
    if(!profile) return;
    const { data:row } = await db._client.from('admins').select('id, data').eq('id', profile.admin_doc_id).maybeSingle();
    if(!row || row.data.active===false) return;
    currentUser = { id:row.id, name:row.data.name, staffId:row.data.staffId, role:row.data.role };
    render();
  }catch(e){ /* session expired / not signed in — the login screen will show */ }
}
function logout(){
  const actor = currentUser;
  currentUser = null;
  loginError = '';
  notifPanelOpen = false;
  profilePanelOpen = false;
  try{ localStorage.removeItem('stk_admin_session'); }catch(e){}
  if(db){ clearStaffData(); db._client.auth.signOut().catch(()=>{}); }
  currentRole = 'track';
  render();
  toast('Logged out');
  if(actor && !db) logActivity('logout', { actor, summary:`${actor.name} logged out` });
}

async function copyTrackingNumber(tn){

  try{
    const ta = document.createElement('textarea');

    toast('Could not copy — please select the tracking number manually');
  }

const AVATAR_PALETTE = [
  ['#0F6E5C','#49D9AF'], ['#2A5FA5','#82B2EA'], ['#B96A1E','#E7A758'],
  ['#AE3527','#EA8A7C'], ['#6B4C9A','#B79CE0'], ['#1E7A45','#74D89A'],

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
// A small abstract gradient-and-initials avatar, generated locally (no
// external avatar service — the published tool can't call one) but unique
// and stable per person: same name + Staff ID always renders the same mark.
function avatarSVG(name, seedExtra, size){

  const [c1, c2] = AVATAR_PALETTE[h % AVATAR_PALETTE.length];

  const initials = (name||'?').trim().split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';

      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>

}

/* ---------- Parcel-deletion requests: any staff can request, only Admin / ---------- */
/* Superadmin can approve or decline one. ---------- */
async function requestParcelDeletion(tn, reason){
  if(!currentUser) return;
  const p = findParcel(tn);
  const now = new Date().toISOString();
  const doc = {
    trackingNumber: tn, reason, status:'pending',
    requestedBy: { id:currentUser.id, name:currentUser.name, staffId:currentUser.staffId },
    requestedAt: now, resolvedBy:null, resolvedAt:null, resolutionNote:'',
  };
  if(db){ await db.collection('deletionRequests').add(doc); }
  else { state.deletionRequests.unshift(Object.assign({ id:'local-dr'+Date.now() }, doc)); render(); }
  await notifyRole(['admin','superadmin'], {
    title:'Deletion request submitted',
    body:`${currentUser.name} requested deletion of ${tn}${p?` (${p.receiver.name})`:''}: ${reason}`,
    kind:'deletion_requested', refType:'parcel', refId:tn,
  });
  logActivity('deletion_requested', { summary:`Requested deletion of ${tn}: ${reason}`, targetType:'parcel', targetId:tn });
}
async function resolveDeletionRequest(requestId, decision, note){
  const reqDoc = state.deletionRequests.find(r=>r.id===requestId);
  if(!reqDoc || !currentUser) return;
  const now = new Date().toISOString();
  const patch = {
    status:decision,
    resolvedBy:{ id:currentUser.id, name:currentUser.name, staffId:currentUser.staffId },
    resolvedAt:now, resolutionNote: note||'',
  };
  if(db){ await rpc('resolve_deletion',{request_id:requestId,decision,note:note||''}); }
  else { Object.assign(reqDoc, patch); }
  if(decision==='approved'){
    if(!db) { state.parcels = state.parcels.filter(p=>p.trackingNumber!==reqDoc.trackingNumber); }
  }
  if(!db) render();
  if(reqDoc.requestedBy && reqDoc.requestedBy.id){
    await notifyUser(reqDoc.requestedBy.id, {
      title: decision==='approved' ? 'Deletion request approved' : 'Deletion request declined',
      body: decision==='approved'
        ? `${reqDoc.trackingNumber} was permanently deleted by ${currentUser.name}.`
        : `${currentUser.name} declined your request to delete ${reqDoc.trackingNumber}${note?`: ${note}`:''}.`,
      kind: decision==='approved' ? 'deletion_approved' : 'deletion_rejected',
      refType:'parcel', refId: reqDoc.trackingNumber,
    });
  }
  logActivity(decision==='approved' ? 'deletion_approved' : 'deletion_declined', {
    summary: decision==='approved'
      ? `Approved deletion of ${reqDoc.trackingNumber} — record permanently removed`
      : `Declined the deletion request for ${reqDoc.trackingNumber}${note?`: ${note}`:''}`,
    targetType:'parcel', targetId: reqDoc.trackingNumber,
  });
}

// Classifies one history entry as a carried-out step, a delivery failure, or
// the note marking a delivery-exception parcel as re-booked, so it gets a
// distinct tick / cross / redo marker and color instead of one generic dot.
function historyEntryKind(h){
  if(h.note && h.note.indexOf('Re-booked after a delivery exception') === 0) return 'rebooked';
  if(h.status === 'exception'){
    return (h.note && h.note.indexOf('Re-booked as new parcel') === 0) ? 'rebooked' : 'failed';
  }
  return 'done';
}
function markerTone(kind){
  if(kind==='failed') return { bg:'var(--red-soft)', line:'var(--red-line)', fg:'var(--red)' };
  if(kind==='rebooked') return { bg:'var(--amber-soft)', line:'var(--amber-line)', fg:'var(--amber)' };
  return { bg:'var(--green-soft)', line:'var(--green-line)', fg:'var(--green)' };
}
// Follows rebookedFrom/rebookedTo in both directions to collect every parcel
// in this delivery's re-book chain (usually just one, but two or more once a
// parcel has been re-booked), so the full past record can be shown together.
function getRebookChain(p){
  let earliest = p;
  const backSeen = new Set([p.trackingNumber]);
  while(earliest.rebookedFrom && !backSeen.has(earliest.rebookedFrom)){
    const prev = findParcel(earliest.rebookedFrom);
    if(!prev) break;
    backSeen.add(prev.trackingNumber);
    earliest = prev;
  }
  const chain = [];
  const fwdSeen = new Set();
  let node = earliest;
  while(node && !fwdSeen.has(node.trackingNumber)){
    chain.push(node);
    fwdSeen.add(node.trackingNumber);
    node = node.rebookedTo ? findParcel(node.rebookedTo) : null;
  }
  return chain;
}
// Every timestamped event for this delivery, across every parcel it was ever
// re-booked as/from, oldest first — the full traceable record in one list.
function combinedHistory(p){
  const chain = getRebookChain(p);
  if(chain.length <= 1) return (p.history||[]).map(h=>Object.assign({}, h, { _tn:p.trackingNumber }));
  const merged = [];
  chain.forEach(cp=>(cp.history||[]).forEach(h=>merged.push(Object.assign({}, h, { _tn:cp.trackingNumber }))));
  merged.sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));
  return merged;
}
// Shared timeline renderer used by both the customer tracking view and the
// admin detail view, so every parcel's full record — including steps that
// happened under a previous or later tracking number — looks the same.
function renderHistoryTimeline(history, currentTn){
  return (history||[]).slice().reverse().map(h=>{
    const kind = historyEntryKind(h);
    const tone = markerTone(kind);
    const label = kind==='rebooked' ? 'Re-booked' : ((STATUS_META[h.status]||{}).label || h.status);
    const tnTag = (h._tn && h._tn !== currentTn) ? `${tnHtml(h._tn, {style:'font-weight:700;'})} &middot; ` : '';
    return `
      <div class="t-step">
        <div class="t-step-line"></div>
        <div class="t-dot" style="background:${tone.bg}; border-color:${tone.line}; color:${tone.fg};">${MARKER_ICON[kind]}</div>
        <div class="t-body">
          <div class="t-label">${tnTag}${esc(label)}</div>
          <div class="t-when">${fmtWhen(h.timestamp)}</div>
          ${h.location?`<div class="t-loc">${esc(h.location)}</div>`:''}
          ${h.note?`<div class="t-note">${esc(h.note)}</div>`:''}
          ${h.actor?`<div class="t-actor">${esc(h.actor)}</div>`:''}
        </div>
      </div>`;
  }).join('');
}

// Re-books a delivery-exception parcel under its OWN tracking number — no
// new tracking ID, no booking form to fill in again. It's reset straight
// back into the warehouse queue (status: booked) ready for "Mark Received
// In-Store", with a "Re-booked" entry appended to its own history so the
// exception, the re-book, and everything that follows all stay on one
// continuous timestamped record for that one tracking number.
async function rebookParcel(tn){
  if(db){ await rpc('transition_parcel',{tracking_number:tn,next_status:'booked'}); currentRole='warehouse'; adminDetail=null; render(); return; }
  const p = findParcel(tn);
  if(!p) return;
  const now = new Date().toISOString();
  const actorLabel = currentUser ? `${currentUser.name} (${currentUser.staffId})` : '';
  const entry = {
    status:'booked', label:STATUS_META.booked.label, timestamp:now,
    location:(p.sender && p.sender.city) || '', actor:actorLabel,
    note:'Re-booked after a delivery exception — ready for warehouse processing',
  };
  const history = (p.history || []).concat([entry]);
  const patch = { status:'booked', rider:null, history, updatedAt:now };
  if(db){ await db.doc(`parcels/${tn}`).update(patch); }
  else { Object.assign(p, patch); render(); }
  adminDetail = null;
  currentRole = 'warehouse';
  render();
  toast(`${tn} re-booked — ready for warehouse processing`);
  logActivity('parcel_rebooked', { summary:`Re-booked ${tn} after a delivery exception`, targetType:'parcel', targetId:tn });
}

function bindShell(){
  // Nav buttons are re-rendered on every render() (their active state and
  // visibility depend on login state), so this delegated listener on the
  // stable parent element keeps working without needing to be re-bound.
  document.getElementById('roleNav').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-role]');
    if(!btn) return;
    currentRole = btn.dataset.role;
    render();
  });
  document.getElementById('accountArea').addEventListener('click', (e)=>{
    if(e.target.closest('[data-staff-login]')){ currentRole = 'warehouse'; render(); return; }
    if(e.target.closest('[data-logout]')){ logout(); return; }
    if(e.target.closest('#notifBellBtn')){ notifPanelOpen = !notifPanelOpen; profilePanelOpen = false; render(); return; }
    if(e.target.closest('#profileBtn')){ profilePanelOpen = !profilePanelOpen; notifPanelOpen = false; render(); return; }
    if(e.target.closest('#markAllReadBtn')){ markAllNotificationsRead(); return; }
    const notifBtn = e.target.closest('[data-notif]');
    if(notifBtn){ handleNotificationClick(notifBtn.dataset.notif); return; }
  });
  // Close the notification/profile dropdowns on any click outside them.
  // Registered on the CAPTURE phase so it inspects e.target before the
  // accountArea click handler (bubble phase, below) has a chance to
  // re-render and detach it — otherwise every toggle click would look like
  // an "outside" click by the time it reached this listener and the panel
  // would close again in the same click that just opened it.
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('#accountArea') && (notifPanelOpen || profilePanelOpen)){
      notifPanelOpen = false; profilePanelOpen = false; render();
    }
  }, true);
  // Tracking-number "click to copy" — delegated on the capture phase so it
  // fires (and can stop propagation) before an ancestor row's own click
  // handler, e.g. an Admin-table row that opens the detail modal on click.
  const copyHandler = (e)=>{
    const el = e.target.closest('[data-copy-tn]');
    if(!el) return;
    e.stopPropagation();
    if(e.type==='keydown' && e.key!=='Enter' && e.key!==' ') return;
    if(e.type==='keydown') e.preventDefault();
    copyTrackingNumber(el.dataset.copyTn);
  };
  document.addEventListener('click', copyHandler, true);
  document.addEventListener('keydown', copyHandler, true);
}

// Builds the curated tracking-ID messages for whichever contact details were
// captured at booking (sender and/or receiver email). A page published
// this way has no backend or outbound network path to actually dispatch real
// email, so this composes the exact message content that would be sent
// and records it on the parcel — shown to staff as a "sent" confirmation
// right after booking, and kept on the parcel's Admin detail for the record.
function composeTrackingNotifications(doc){
  const company = state.settings.name || 'STALLIONKING TRACKER';
  const route = `${doc.sender.city} → ${doc.receiver.city}`;
  const now = new Date().toISOString();
  const contacts = [
    { role:'Sender',   name:doc.sender.name,   email:doc.sender.email,   phone:doc.sender.phone },
    { role:'Receiver', name:doc.receiver.name, email:doc.receiver.email, phone:doc.receiver.phone },
  ];
  const notifications = [];
  contacts.forEach(c=>{
    if(c.email){
      notifications.push({
        channel:'email', recipientRole:c.role, to:c.email, sentAt:now,
        subject:`Your parcel is booked — Tracking No. ${doc.trackingNumber}`,
        body:`Hi ${c.name}, your parcel with ${company} has been booked. Tracking number: ${doc.trackingNumber}. Route: ${route}. Track it anytime on our Track a Parcel page using this number. Thank you for shipping with us.`,
      });
    }

  });
  return notifications;
}

async function createParcel(payload){
  if(db){
    // Real backend: the tracking number, the parcel doc, AND the actual
    // email notifications are all generated server-side (see
    // supabase/functions/book-parcel) — the Resend API keys used to
    // send them can only live there, never in this browser-facing file.
    // The function also writes its own activity-log entries, so there's
    // nothing left to log client-side here.
    return await callFunction('book-parcel', {
      requestId:bookingRequestId,
      sender: payload.sender,
      receiver: payload.receiver,
      description: payload.description,
      weightKg: payload.weightKg,
      serviceType: payload.serviceType,
      clientId: payload.clientId || null,
      sendNotification: payload.sendNotification !== false,
    });
  }

  // Local demo mode (no backend configured) — unchanged from before:
  // compose the notification preview locally, there's nowhere real to send it.
  let tn;
  for(let attempt=0; attempt<5; attempt++){
    tn = `${state.settings.prefix || 'TRK'}-${genCode(8)}`;
    const existing = state.parcels.find(p=>p.trackingNumber===tn);
    if(!existing) break;
  }
  const now = new Date().toISOString();
  const actorLabel = currentUser ? `${currentUser.name} (${currentUser.staffId})` : 'Customer';
  const entry = {
    status:'booked', label:STATUS_META.booked.label, timestamp:now, location:payload.sender.city || '', actor:actorLabel, note:'',
  };
  const doc = {
    trackingNumber: tn,
    createdAt: now, updatedAt: now,
    sender: payload.sender, receiver: payload.receiver,
    senderClientId: payload.clientId || null,
    rebookedFrom: null, rebookedTo: null,
    description: payload.description, weightKg: payload.weightKg, serviceType: payload.serviceType,
    status:'booked', rider:null,
    history:[entry],
  };
  const wantsSend = payload.sendNotification !== false;
  doc.notifications = wantsSend ? composeTrackingNotifications(doc) : [];
  state.parcels.unshift(doc); render();
  logActivity('parcel_booked', { summary:`Booked parcel ${tn} for ${payload.receiver.name}`, targetType:'parcel', targetId:tn });
  if(doc.notifications.length){
    logActivity('tracking_notified', { summary:`Sent tracking ID ${tn} to ${doc.notifications.length} recipient${doc.notifications.length===1?'':'s'} by email`, targetType:'parcel', targetId:tn });
  }
  return { tn, notifications: doc.notifications, notificationsSkipped: !wantsSend };
}

async function advanceStatus(tn, statusKey, extra){

  if(!p) return;

  const entry = {

    location: extra.location || '', actor: actorLabel, note: extra.note || '',
  };
  const history = (p.history || []).concat([entry]);

// The Warehouse dashboard exposes a single "Received In-Store" action
// instead of the three separate clicks it used to take (Mark Received
// In-Store / Mark Packaged / Scan for Transit). One click here walks the
// parcel through every remaining pre-dispatch status in one write, so it's
// immediately ready for the Dispatch queue — while still recording the full
// granular history (Received In-Store, Packaged, Scanned / In Transit) that
// Admin's history timeline and STATUS_META detail rely on elsewhere.
async function receiveInStore(tn){
  if(db){ await rpc('transition_parcel',{tracking_number:tn,next_status:'scanned'}); return; }
  const p = findParcel(tn);
  if(!p) return;
  const fromIdx = STATUS_FLOW.indexOf(p.status);
  const toIdx = STATUS_FLOW.indexOf('scanned');
  const remaining = fromIdx>=0 ? STATUS_FLOW.slice(fromIdx+1, toIdx+1) : [];
  if(!remaining.length) return;
  const now = Date.now();
  const actorLabel = currentUser ? `${currentUser.name} (${currentUser.staffId})` : '';
  const loc = (p.sender && p.sender.city) ? `${p.sender.city} Hub` : '';
  const newEntries = remaining.map((statusKey, i) => ({
    status: statusKey, label: STATUS_META[statusKey].label,
    timestamp: new Date(now + i).toISOString(), // tiny offset keeps entries in order
    location: loc, actor: actorLabel, note: '',
  }));
  const history = (p.history || []).concat(newEntries);
  const patch = { status:'scanned', updatedAt: new Date(now + remaining.length - 1).toISOString(), history };
  if(db){ await db.doc(`parcels/${tn}`).update(patch); }
  else { Object.assign(p, patch); render(); }
  logActivity('parcel_received_in_store', { summary:`Marked ${tn} Received In-Store — processed and ready for dispatch`, targetType:'parcel', targetId:tn });
}

  else if(currentRole==='dispatch') main.innerHTML = viewDispatch();
  else if(currentRole==='admins') main.innerHTML = viewAdminUsers();
  else if(currentRole==='activity') main.innerHTML = viewActivityLog();
  else main.innerHTML = viewAdmin();
  bindView();
  if(sameView) for(const item of saved){ const el=main.querySelector(item.key); if(!el) continue; if(el.type!=='file'){ el.value=item.value; el.checked=item.checked; } if(item.focused){ el.focus(); if(item.start!=null && el.setSelectionRange) el.setSelectionRange(item.start,item.end); } }
}

// The three-phase progress bar shown on the public Track view (see
// TRACK_PHASES/trackPhaseIndex above). The final phase reads "Delivered"
// once reached normally, or "Returned" (styled red) if the parcel ended in
// a delivery exception instead.
function renderTrackStepper(p){
  const phaseIdx = trackPhaseIndex(p.status);
  const isReturned = p.status === 'exception';
  return TRACK_PHASES.map((label, i)=>{
    const isFinal = i === TRACK_PHASES.length - 1;
    const shownLabel = (isFinal && isReturned) ? 'Returned' : label;
    let cls, icon;
    if(i < phaseIdx){
      cls = 'done'; icon = MARKER_ICON.done;
    } else if(i === phaseIdx){
      if(isFinal){
        cls = isReturned ? 'failed' : 'done';
        icon = isReturned ? MARKER_ICON.failed : MARKER_ICON.done;
      } else {
        cls = 'current'; icon = MARKER_ICON.current;
      }
    } else {
      cls = ''; icon = MARKER_ICON.pending;
    }
    return `<div class="stepper-step ${cls}"><div class="stepper-line"></div><div class="dot">${icon}</div><div class="lbl">${esc(shownLabel)}</div></div>`;
  }).join('');
}
// The reason + free-text detail staff captured when flagging a return (see
// EXCEPTION_REASONS and the Report Issue modal), for display at the
// "Returned" phase on the Track view.
function latestExceptionEntry(p){
  return (p.history||[]).slice().reverse().find(h=>h.status==='exception') || null;
}

function renderParcelDetail(p){
  const isException = p.status === 'exception';
  const excEntry = isException ? latestExceptionEntry(p) : null;

  const rider = p.rider ? `
    <div class="rider-card">
      <div class="rider-avatar">${esc((p.rider.name||'?').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
      <div>
        <div class="rname">${esc(p.rider.name)}</div>
        <div class="rmeta">${esc(p.rider.phone||'')} &middot; Delivery rider</div>
      </div>
    </div>` : '';

  const chain = getRebookChain(p);
  const hist = renderHistoryTimeline(combinedHistory(p), p.trackingNumber);

  return `
    <div class="card card-pad" style="margin-top:18px;">
      <div class="section-head">
        <div>
          <div class="route-row">${esc(p.sender.city)}<span class="route-arrow">&rarr;</span>${esc(p.receiver.city)}</div>
          <div class="muted">Tracking ${tnHtml(p.trackingNumber)}</div>
        </div>
        ${pill(p.status)}
      </div>
      <div class="parcel-meta">
        ${currentUser ? `<span><b>To:</b> ${esc(p.receiver.name)}</span>
        <span><b>Phone:</b> ${esc(p.receiver.phone)}</span>
        ${p.receiver.email?`<span><b>Email:</b> ${esc(p.receiver.email)}</span>`:''}
        <span><b>Service:</b> ${esc(p.serviceType)}</span>
        <span><b>Item:</b> ${esc(p.description)}</span>
        <span><b>Weight:</b> ${esc(p.weightKg)}</span>` : `<span><b>Service:</b> ${esc(p.serviceType)}</span>`}
      </div>
      ${p.receiver.address ? `<div class="hint" style="margin-bottom:14px;"><b>Delivery address:</b> ${esc(p.receiver.address)}${p.receiver.landmark?` &middot; near ${esc(p.receiver.landmark)}`:''}</div>` : ''}
      <div class="stepper">${renderTrackStepper(p)}</div>
      ${isException ? `
      <div class="rider-card" style="background:var(--red-soft); border-color:var(--red-line); align-items:flex-start;">
        <div style="color:var(--red);">${MARKER_ICON.failed}</div>
        <div>
          <div class="rname">Delivery exception</div>
          ${excEntry && excEntry.note ? `<div class="rmeta" style="margin-top:3px;"><b>Reason:</b> ${esc(excEntry.note)}</div>` : ''}
          <div class="rmeta" style="margin-top:3px;">${p.rebookedTo?`This parcel was re-booked as ${tnHtml(p.rebookedTo)} — track that number for the current status.`:'See full history below for details.'}</div>
        </div>
      </div>` : ''}
      ${p.rebookedFrom ? `<div class="hint" style="margin:10px 0;">Re-booked after a delivery exception on ${tnHtml(p.rebookedFrom)}.</div>` : ''}
      ${rider}
      <div class="section-head" style="margin-top:16px;">
        <h2 style="font-size:13px;">Full history</h2>
        ${chain.length>1?`<div class="muted" style="font-size:11px;">Includes ${chain.length} linked bookings for this delivery</div>`:''}
      </div>
      <div class="timeline">${hist}</div>
    </div>
  `;
}

          <button class="btn btn-sm ${inactive?'':'btn-danger'}" data-toggle-admin="${esc(a.id)}" data-next-active="${inactive}" ${isMe && !inactive?'disabled title="You cannot deactivate your own account while logged in"':''}>${inactive?'Reactivate':'Deactivate'}</button>
          <button class="btn btn-sm btn-danger" data-delete-admin="${esc(a.id)}" ${isMe?'disabled title="You cannot delete your own account while logged in"':''}>Delete</button>
        </div>
      </div>`;
  }).join('');

  const modal = adminUserModal ? `<div class="overlay" id="adminUserOverlay"><div class="modal" style="max-width:440px;">${renderAdminUserModal(adminUserModal)}</div></div>` : '';

  return `
    <div class="section-head" style="margin-top:22px;">
      <div><h2>Admin Users</h2><div class="muted">Create, edit and remove staff logins. Each profile is identified by name and Staff ID Number.</div></div>
    </div>
    <div style="display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start;">
      <div class="card card-pad">
        <div class="section-head"><h2 style="font-size:14px;">Add an admin</h2></div>
        <form id="adminUserForm">
          <div class="field"><label>Full name</label><input name="name" required></div>
          <div class="field"><label>Staff ID Number</label><input name="staffId" placeholder="e.g. SK-0002" required style="text-transform:uppercase;"></div>
          <div class="field"><label>Password</label>${pwFieldHtml('<input type="password" name="password" required minlength="12">')}</div>
          <div class="field"><label>Role</label><select name="role"><option value="staff" selected>Staff</option><option value="admin">Admin</option><option value="superadmin">Superadmin</option></select></div>
          <button class="btn btn-primary" style="width:100%;" type="submit">Create login</button>
        </form>
        <div class="demo-note">${db ? 'Passwords are created as real Supabase Auth logins — never stored in plain text.' : 'Demo authentication — credentials are stored as plain data in the shared workspace and aren\'t production-grade security.'}</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        ${cards || `<div class="card"><div class="empty-state">No admin logins yet.</div></div>`}
      </div>
    </div>
    ${modal}
  `;
}

function renderAdminUserModal(id){
  const a = findAdminById(id);
  if(!a) return `<button class="modal-close" data-close-admin-user>&times;</button><div class="empty-state">Admin not found.</div>`;
  return `
    <button class="modal-close" data-close-admin-user>&times;</button>
    <div class="section-head"><div><h2 style="font-size:15px;">Edit admin login</h2><div class="muted tn" style="margin-top:2px;">${esc(a.staffId)}</div></div></div>
    <form id="editAdminForm" data-id="${esc(a.id)}" style="margin-top:10px;">
      <div class="field"><label>Full name</label><input name="name" value="${esc(a.name)}" required></div>
      <div class="field"><label>Staff ID Number</label><input name="staffId" value="${esc(a.staffId)}" readonly style="text-transform:uppercase; opacity:.7;"></div>
      <div class="hint" style="margin-top:-8px; margin-bottom:4px;">Staff ID can't be changed once a login exists — it's tied to how the account signs in. Deactivate and create a new login instead if it was entered wrong.</div>
      <div class="field"><label>New password</label>${pwFieldHtml('<input type="password" name="password" placeholder="Leave blank to keep current password">')}</div>
      <div class="field"><label>Role</label><select name="role"><option value="staff" ${a.role==='staff'||!a.role?'selected':''}>Staff</option><option value="admin" ${a.role==='admin'?'selected':''}>Admin</option><option value="superadmin" ${a.role==='superadmin'?'selected':''}>Superadmin</option></select></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
